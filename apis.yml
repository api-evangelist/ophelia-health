aid: ophelia-health
name: Ophelia Health
description: >-
  Ophelia is a telehealth company providing private, evidence-based medication-assisted
  treatment (MAT) for opioid use disorder from home. Founded in 2019 by Zack Gray and Mattan
  Griffel and headquartered in New York City, Ophelia connects patients with licensed
  clinicians for video visits, prescribes Suboxone (buprenorphine + naloxone) sent to a local
  pharmacy, and provides ongoing care-team support seven days a week. The subscription service
  accepts most major insurance plans, including Medicaid, and is licensed to provide care
  across 49 states and Washington, D.C. Ophelia is a direct-to-consumer clinical service and
  does not publish a public developer API, SDK, or partner API program; this profile captures
  its public web presence and domain security posture.
